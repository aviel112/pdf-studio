<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#07080f;--panel:#0f111a;--line:rgba(255,255,255,.08);--text:#e8e8f0;--text2:#9a9cb0;--text3:#5d6075;
  --accent:#ff6b35;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Heebo',sans-serif}
body{min-height:100vh}
button,input,textarea{font-family:inherit}

/* ---------- APP ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:1.05rem;direction:ltr;letter-spacing:4px}
.logo b{color:var(--accent)}
.top small{color:var(--text3);font-size:.78rem}
.app{display:grid;grid-template-columns:440px 1fr;min-height:calc(100vh - 62px)}
.side{border-left:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:14px;background:var(--panel)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#0a0b12;border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{height:46px;border:0;border-radius:10px;background:transparent;color:var(--text2);font-weight:700;font-size:.95rem;cursor:pointer;transition:.2s}
.seg button.on{background:var(--accent);color:#fff;box-shadow:0 6px 20px rgba(255,107,53,.3)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.75rem;color:var(--text2);font-weight:600}
.inp{height:42px;border-radius:10px;border:1px solid var(--line);background:#0a0b12;color:var(--text);padding:0 12px;font-size:.92rem;outline:none;transition:.2s}
.inp:focus,textarea:focus{border-color:var(--accent)}
textarea{flex:1;min-height:320px;border-radius:12px;border:1px solid var(--line);background:#0a0b12;color:var(--text);padding:14px;font-size:.92rem;line-height:1.7;resize:vertical;outline:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip-btn{height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--text2);font-size:.78rem;cursor:pointer}
.chip-btn:hover{color:var(--accent);border-color:var(--accent)}
.tog{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--text2);cursor:pointer;user-select:none}
.tog input{accent-color:var(--accent);width:16px;height:16px}
.colors{display:flex;gap:8px;align-items:center;font-size:.75rem;color:var(--text2);font-weight:600}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 2px var(--panel)}
.sw.on{border-color:#fff}
.stats{font-size:.78rem;color:var(--text2);line-height:1.7;background:#0a0b12;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stats b{color:var(--text)}
.stats .warn{color:#ffb38f}
.help{font-size:.74rem;color:var(--text3);line-height:1.7}
.help code{background:rgba(255,255,255,.06);padding:1px 6px;border-radius:5px;color:var(--text2)}
.actions{display:flex;gap:10px}
.btn{flex:1;height:54px;border-radius:14px;border:0;font-weight:800;font-size:1rem;cursor:pointer;transition:.2s}
.btn.main{background:linear-gradient(135deg,#ff6b35,#ff8a50);color:#fff;box-shadow:0 10px 30px rgba(255,107,53,.28)}
.btn.main:hover{transform:translateY(-1px)}
.btn.sec{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--line);flex:.55}
.btn:disabled{opacity:.6;cursor:wait}
.preview{padding:28px;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:22px;background:#1a1c25}
.pv-wrap{position:relative;flex:none;box-shadow:0 20px 50px rgba(0,0,0,.5);overflow:hidden}
.pv-wrap .page{position:absolute;top:0;right:0;transform-origin:top right}
.pv-label{font-size:.72rem;color:var(--text3);margin-top:-14px}
.empty{color:var(--text3);margin-top:120px;text-align:center;line-height:1.8}
#stage{position:absolute;left:-20000px;top:0}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#0a0b12;border:1px solid var(--line);border-radius:12px;padding:3px}
.seg2 button{height:34px;border:0;border-radius:9px;background:transparent;color:var(--text2);font-weight:700;font-size:.82rem;cursor:pointer}
.seg2 button.on{background:rgba(255,107,53,.15);color:var(--accent)}
#wiz{display:flex;flex-direction:column;gap:14px}
.step{background:#0a0b12;border:1px solid var(--line);border-radius:14px;padding:14px}
.step-t{display:flex;align-items:center;gap:10px;font-size:.88rem;font-weight:800;margin-bottom:12px}
.step-t span{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:.78rem;display:flex;align-items:center;justify-content:center;flex:none}
.days-pick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.days-pick button{height:46px;border-radius:11px;border:1px solid var(--line);background:transparent;color:var(--text);font-weight:900;font-size:1.1rem;cursor:pointer;transition:.15s}
.days-pick button small{display:block;font-size:.6rem;font-weight:600;color:var(--text3)}
.days-pick button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.days-pick button.on small{color:rgba(255,255,255,.8)}
#dayCards{display:flex;flex-direction:column;gap:10px}
.day{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel)}
.day-h{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;margin-bottom:8px}
.day-h b{background:rgba(255,107,53,.15);color:var(--accent);border-radius:8px;padding:6px 10px;font-size:.8rem;white-space:nowrap}
.day-h .inp{height:36px;font-size:.85rem}
.day select.inp{height:36px;font-size:.82rem;width:100%;margin-bottom:8px;cursor:pointer}
.day textarea{min-height:120px;flex:none;width:100%;font-size:.85rem;padding:10px}
.day.is-dup .day-h .inp{display:none}
.day.is-dup .day-h{grid-template-columns:auto;justify-items:start}
.dup-note{font-size:.82rem;color:#7fe0a8;background:rgba(74,222,128,.08);border:1px dashed rgba(74,222,128,.3);border-radius:10px;padding:10px;text-align:center}
textarea.small{min-height:80px;flex:none;width:100%}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{border-left:0;border-bottom:1px solid var(--line);padding:16px}
  .preview{padding:16px}
  textarea{min-height:240px}
  .top{padding:14px 16px}
}

/* ---------- PDF PAGE (A4 @96dpi) — light, clean ---------- */
.page{--a:#1a6fe0;--a-soft:#eef4fd;--ink:#14171f;--ink2:#4a5162;--ink3:#8a91a3;--rule:#e3e7ee;
  width:794px;height:1123px;background:#fff;color:var(--ink);font-family:'Heebo',sans-serif;direction:rtl;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:44px 46px 0}
.page .topbar{position:absolute;top:0;left:0;right:0;height:6px;background:var(--a)}
.pg-body{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:18px;padding-bottom:6px}
.pg-foot{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--rule);font-size:10.5px;color:var(--ink3)}
.pg-foot .fb{direction:ltr;font-weight:800;letter-spacing:2.5px;color:var(--ink2)}
.pg-foot .fb span{color:var(--a)}
.mini-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;margin-bottom:20px;border-bottom:1px solid var(--rule);font-size:11.5px;color:var(--ink3);flex:none}
.mini-head b{color:var(--ink);font-weight:800}
.mini-head .mb{direction:ltr;font-weight:900;letter-spacing:3px;color:var(--ink2);font-size:11px}
.mini-head .mb span{color:var(--a)}

/* hero */
.hero{text-align:center;padding-top:6px}
.brand{direction:ltr;font-weight:800;font-size:10.5px;letter-spacing:5px;color:var(--ink3)}
.brand span{color:var(--a)}
.hero h1{font-size:40px;font-weight:900;line-height:1.15;margin-top:14px;color:var(--ink)}
.hero h1 .nm{color:var(--a)}
.hero .meta{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill{font-size:11.5px;font-weight:600;color:var(--ink2);background:#f4f6f9;border:1px solid var(--rule);border-radius:99px;padding:3px 12px}
.pill.a{color:var(--a);background:var(--a-soft);border-color:transparent;font-weight:700}
.hero .sub{font-size:13.5px;color:var(--ink2);margin:14px auto 0;max-width:560px;line-height:1.6}
.hero .sub div+div{margin-top:2px}
.hero-rule{width:56px;height:3px;border-radius:3px;background:var(--a);margin:16px auto 0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.tile{border:1px solid var(--rule);border-radius:12px;padding:11px 10px;text-align:center}
.tile.k{background:var(--a);border-color:var(--a)}
.tile .v{font-size:22px;font-weight:900;line-height:1.1}
.tile .v small{font-size:11px;font-weight:600;color:var(--ink3);margin-right:2px}
.tile .l{font-size:10.5px;color:var(--ink3);margin-top:3px;font-weight:600}
.tile.k .v,.tile.k .v small,.tile.k .l{color:#fff}
.sched{display:flex;justify-content:center;gap:8px;margin-top:18px}
.sd{min-width:62px;border:1px solid var(--rule);border-radius:10px;padding:7px 10px;text-align:center}
.sd small{display:block;font-size:10px;color:var(--ink3);font-weight:600}
.sd b{display:block;font-size:20px;font-weight:900;color:var(--a);line-height:1.2;direction:ltr}
.sd.off b{color:var(--ink3)}
.est{font-size:9.5px;color:var(--ink3);margin-top:7px;text-align:center}

/* section (shared by workout + menu) */
.sec{flex:none}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.badge{min-width:30px;height:30px;padding:0 8px;border-radius:8px;background:var(--a);color:#fff;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;direction:ltr;flex:none}
.sec-title{font-size:18px;font-weight:800;color:var(--ink);line-height:1.25}
.sec-title .paren{display:block;color:var(--ink3);font-weight:500;font-size:12px;margin-top:1px}
.sec-side .pill{white-space:nowrap}
.cont-tag{display:none;font-size:12px;color:var(--ink3);font-weight:500}
.cont .cont-tag{display:inline}
.sec-side{margin-right:auto;display:flex;gap:6px;align-items:center}
.tbl{border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.grid{display:grid;grid-template-columns:var(--cols)}
.th{background:var(--a);color:#fff;font-size:11.5px;font-weight:700}
.th>span{padding:9px 10px;text-align:center}
.th>span.r,.tr>span.r{text-align:right}
.tr{border-top:1px solid var(--rule);font-size:12.5px;align-items:stretch}
.th+.rows .tr:first-child{border-top:0}
.rows .tr:nth-child(even){background:#f8f9fb}
.tr>span{padding:10px 12px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.4}
.tr>span+span,.th>span+span{border-right:1px solid var(--rule)}
.th>span+span{border-right-color:rgba(255,255,255,.18)}
.tr>span.r{justify-content:flex-start}
.tr .mus{font-weight:800;color:var(--ink);justify-content:flex-start}
.tr .ex{color:var(--ink)}
.tr .num{font-weight:700;direction:ltr;color:var(--ink)}
.tr .nt{font-size:11px;color:var(--ink2)}
.tr.ss>span:first-child{box-shadow:inset -3px 0 0 var(--a)}
.ss-tag{display:inline-block;font-size:9.5px;font-weight:700;color:var(--a);background:var(--a-soft);border-radius:4px;padding:1px 6px;margin-right:6px;white-space:nowrap}
.tr.or{background:#fff !important}
.tr.or>span{grid-column:1/-1;font-size:10.5px;font-weight:800;color:var(--a);padding:4px;letter-spacing:1px;border:0}
.tr .alt{color:var(--ink2)}
.tfoot{background:var(--a-soft);border-top:1px solid var(--rule);font-size:11.5px;font-weight:700;color:var(--ink)}
.tfoot>span{padding:8px 10px;text-align:center}
.tfoot>span+span{border-right:1px solid var(--rule)}
.split .tfoot{display:none}
.pill.kc{direction:rtl}

/* inline ltr ranges */
.ltr{display:inline-block;direction:ltr;margin:0 3px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:none;align-items:stretch}
.pair .meal{display:flex;flex-direction:column}
.pair .meal:only-child{grid-column:1/-1}
.pair .meal .rows{flex:1}
.pair .meal-head{padding:12px 14px;gap:9px}
.pair .meal-name{font-size:15.5px}
.pair .meal .rows{padding:2px 14px}
.pair .item{font-size:13px;gap:9px;padding:7px 0}
.pair .after{padding:8px 14px;gap:10px;font-size:10.5px}

/* menu cards */
.meal{flex:none;border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.meal-head{display:flex;align-items:center;gap:12px;padding:13px 18px;background:#f8f9fb;border-bottom:1px solid var(--rule)}
.meal-head .badge{width:30px;min-width:30px;padding:0;border-radius:50%;font-size:13px}
.meal-name{font-size:17px;font-weight:800;color:var(--ink);flex:1}
.meal .rows{padding:6px 18px}
.item{display:flex;align-items:center;gap:12px;padding:9px 0;font-size:14px;border-bottom:1px dashed var(--rule)}
.item:last-child{border-bottom:0}
.item .dot{width:7px;height:7px;border-radius:50%;background:var(--a);flex:none}
.item .iname{flex:1;color:var(--ink)}
.item .iamt{font-size:12.5px;font-weight:700;color:var(--a);background:var(--a-soft);border-radius:7px;padding:3px 11px;white-space:nowrap}
.item.alt .dot{background:#fff;border:1.5px solid var(--a)}
.item.alt .iname{color:var(--ink2)}
.orsep{display:flex;align-items:center;gap:10px;font-size:10.5px;font-weight:800;color:var(--a);padding:3px 0}
.orsep:before,.orsep:after{content:'';flex:1;height:1px;background:var(--rule)}
.after{display:flex;gap:18px;padding:9px 18px;border-top:1px solid var(--rule);font-size:11.5px;color:var(--ink3)}
.after b{color:var(--ink);font-weight:700}
.split .after{display:none}

/* notes */
.notes{flex:none;background:#f8f9fb;border:1px solid var(--rule);border-right:4px solid var(--a);border-radius:10px;padding:14px 18px}
.notes-title{font-size:14px;font-weight:800;color:var(--ink);margin-bottom:6px}
.note{display:flex;gap:8px;font-size:12.5px;line-height:1.6;padding:2px 0;color:var(--ink2)}
.note:before{content:'•';color:var(--a);font-weight:900}
.closing{margin-top:auto;text-align:center;padding:16px 0 4px;flex:none}
.closing .q{font-size:15px;font-weight:800;color:var(--ink)}
.closing .q span{color:var(--a)}
.closing .s{font-size:11px;color:var(--ink3);margin-top:3px}
</style>
</head>
<body>
<header class="top">
  <div class="logo">PDF <b>STUDIO</b></div>
  <small>תפריטים ותוכניות אימון — מטקסט ל-PDF מעוצב</small>
</header>

<div class="app">
  <aside class="side">
    <div class="seg" id="seg">
      <button data-t="menu" class="on">🍽️ תפריט</button>
      <button data-t="workout">🏋️ תוכנית אימון</button>
    </div>
    <div class="row2">
      <label class="f">שם הלקוח<input class="inp" id="client" placeholder="לדוגמה: אלמוג"></label>
      <label class="f">תאריך<input class="inp" id="date"></label>
    </div>
    <label class="f">כותרת<input class="inp" id="title"></label>
    <label class="f">שורת הסבר מתחת לכותרת (לא חובה)<input class="inp" id="subtitle" placeholder="לדוגמה: יש להקפיד על יום מנוחה אחד לפחות בין האימונים"></label>
    <div class="seg2" id="wkMode"><button data-m="wizard" class="on">שלב אחר שלב</button><button data-m="free">הדבקה חופשית</button></div>
    <div id="wiz">
      <div class="step"><div class="step-t"><span>1</span>לכמה ימים לחלק את השבוע?</div><div class="days-pick" id="daysPick"></div></div>
      <div class="step"><div class="step-t"><span>2</span>מה עושים בכל יום?</div><div id="dayCards"></div></div>
      <div class="step"><div class="step-t"><span>3</span>דגשים לתוכנית (לא חובה)</div><textarea id="wkNotes" class="small" spellcheck="false" placeholder="להעלות משקל כשמגיעים לטווח העליון&#10;5 דק׳ חימום לפני כל אימון"></textarea></div>
    </div>
    <textarea id="src" spellcheck="false"></textarea>
    <div class="tools">
      <button class="chip-btn" id="sample">טען דוגמה</button>
      <button class="chip-btn" id="clear">נקה</button>
      <label class="tog" id="macroTog"><input type="checkbox" id="macros" checked>מאקרו (הערכה)</label>
      <label class="tog" id="musTog"><input type="checkbox" id="muscles" checked>קבוצת שריר</label>
    </div>
    <div class="colors" id="colors">צבע:</div>
    <div class="stats" id="stats"></div>
    <div class="help" id="help"></div>
    <div class="actions">
      <button class="btn main" id="dl">⬇ הורד PDF</button>
      <button class="btn sec" id="share" hidden>שתף</button>
    </div>
  </aside>
  <main class="preview" id="preview"></main>
</div>
<div id="stage"></div>

<script>
/* ================= FOOD DB (per 100g: protein, carbs, fat; u = grams per unit) ================= */
const FOODS = [

 ['קוטג|קוטג\'|קוטג׳',11,3.5,5,250],
 ['גבינה לבנה|לבנה|גבינת שמנת|סקי',9,4,5,250],
 ['יוגורט חלבון|יופלה פרו|גו חלבון|פרו',10,5,0.5,200],
 ['יוגורט|אקטיביה|דנונה',4,6,3,200],
 ['גבינה צהובה|צהובה',27,0,26,20],
 ['בולגרית|פטה|צפתית|גבינה מלוחה',17,2,16,30],
 ['חלב',3.3,4.8,2,240],
 ['אבקת חלבון|חלבון|שייק חלבון|סקופ',80,8,5,30],

 ['לחם מלא|לחם כוסמין|לחם שיפון|לחם',9,45,3,30],
 ['פיתה|פיתות',9,56,1.5,80],
 ['לחמניה|לחמנייה|לחמניות',9,50,4,70],
 ['טורטיה|טורטיות|לאפה',8,50,7,60],
 ['פריכית|פריכיות|פריכיות אורז',8,80,3,9],
 ['קרקר|קרקרים',10,68,10,8],
 ['אורז מלא',2.6,23,0.9,160],
 ['אורז|אורז לבן|סושי',2.7,28,0.3,160],

function parseMenu(text){
  const sections=[];let cur=null,notes=null,mode='meal',nextAlt=false;
  const ensure=()=>{if(!cur){cur={name:'התפריט',time:'',items:[]};sections.push(cur)}return cur};
  for(let raw of text.split('\n')){
    let line=raw.trim();if(!line) continue;
    if(line.startsWith('#')){line=line.replace(/^#+\s*/,'');if(NOTES_RE.test(line)){mode='notes';notes=notes||[];continue}}
    else if(NOTES_RE.test(line)){mode='notes';notes=notes||[];continue}
    else if(/^(הערה|דגש)\s*:/.test(line)){(notes=notes||[]).push(line.replace(/^(הערה|דגש)\s*:\s*/,''));continue}

    const colon=noTime.indexOf(':');

function newPage(stage,first,o){
  const p=h('div','page');p.style.setProperty('--a',o.color.a);p.style.setProperty('--a-soft',o.color.soft);
  p.innerHTML=`<div class="topbar"></div>${first?'':`<div class="mini-head"><div><b>${escH(o.title)}</b>${o.client?' · '+escH(o.client):''}</div><div class="mb">AVIEL <span>AMIRA</span></div></div>`}
    <div class="pg-body"></div><div class="pg-foot"><div class="fb">AVIEL <span>AMIRA</span> · @avielife1</div><div class="pn"></div></div>`;
  stage.appendChild(p);return p.querySelector('.pg-body');
}
const fits=body=>body.scrollHeight<=body.clientHeight+1;
function paginate(stage,blocks,o){
  stage.innerHTML='';let body=newPage(stage,true,o);
  const queue=[...blocks];
  while(queue.length){
    const b=queue.shift();body.appendChild(b);
    if(fits(body)) continue;
    const only=body.children.length===1;
    if(!only&&b.offsetHeight<body.clientHeight-(body.closest('.page').querySelector('.mini-head')?0:60)){b.remove();body=newPage(stage,false,o);queue.unshift(b);continue}
    const rows=b.classList.contains('pair')?null:b.querySelector('.rows');
    if(rows&&rows.children.length>1){
      const cont=b.cloneNode(true);cont.classList.add('cont');const crows=cont.querySelector('.rows');crows.innerHTML='';
      b.classList.add('split');
      while(!fits(body)&&rows.children.length>1) crows.prepend(rows.lastElementChild);
      if(fits(body)&&(rows.children.length>=3||only)){queue.unshift(cont);body=newPage(stage,false,o);continue}
      while(crows.firstElementChild) rows.appendChild(crows.firstElementChild);
      b.classList.remove('split');
    }
    if(only) continue;
    b.remove();body=newPage(stage,false,o);queue.unshift(b);
  }
  const close=h('div','closing',`<div class="q">מתאמנים <span>יחד</span>. לא מהצד.</div><div class="s">יש שאלה? שלח/י לי הודעה — אני כאן.</div>`);
  body.appendChild(close);if(!fits(body)) close.remove();
  const pages=[...stage.querySelectorAll('.page')];
  pages.forEach((p,i)=>p.querySelector('.pn').textContent=`עמוד ${i+1} מתוך ${pages.length}`);
  return pages;
}

  const pv=$('#preview');
  const wiz=TYPE==='workout'&&wk.mode==='wizard';const wdata=wiz?buildWizardData():null;
  if(wiz?!wdata.sections.length:!src.trim()){pv.innerHTML=wiz?`<div class="empty">בחר לכמה ימים לחלק את השבוע,<br>וכתוב את התרגילים של כל יום.<br><br>רוצה לראות איך זה נראה? לחץ <b>טען דוגמה</b>.</div>`:`<div class="empty">הדבק כאן ${TYPE==='menu'?'תפריט':'תוכנית אימון'} כרשימה פשוטה<br>והוא יהפוך ל-PDF מעוצב.<br><br>לא בטוח בפורמט? לחץ <b>טען דוגמה</b>.</div>`;$('#stats').innerHTML='מחכה לטקסט…';pages=[];return}
  let res;
  if(TYPE==='menu'){res=buildMenuBlocks(parseMenu(src),o);const s=res.stats;
    $('#stats').innerHTML=`זוהו <b>${s.count}</b> ארוחות · <b>${s.items}</b> פריטים`+(o.macros?` · <b>~${r0(s.tot.kcal)}</b> קק״ל`:'')+(o.macros&&s.unknown.length?`<br><span class="warn">לא נכנסו למאקרו: ${s.unknown.map(escH).join(', ')}</span>`:'');}
  else{res=buildWorkoutBlocks(wiz?wdata:parseWorkout(src),o);const s=res.stats;
    $('#stats').innerHTML=`זוהו <b>${s.count}</b> טבלאות · <b>${s.items}</b> תרגילים`+(o.muscles&&s.noMus.length?`<br><span class="warn">בלי קבוצת שריר: ${s.noMus.map(escH).join(', ')} — אפשר לכתוב "חזה - …" בתחילת השורה</span>`:'');}
  pages=paginate($('#stage'),res.blocks,o);
  const w=Math.min(pv.clientWidth-(innerWidth<900?32:56),680),sc=w/794;
  pv.innerHTML='';
  pages.forEach((p,i)=>{const wrap=h('div','pv-wrap');wrap.style.width=794*sc+'px';wrap.style.height=1123*sc+'px';const c=p.cloneNode(true);c.style.transform=`scale(${sc})`;wrap.appendChild(c);pv.appendChild(wrap);pv.appendChild(h('div','pv-label',`עמוד ${i+1}`))});
}
const later=()=>{clearTimeout(timer);timer=setTimeout(render,250)};
['#src','#client','#date','#title','#subtitle'].forEach(s=>$(s).addEventListener('input',later));
$('#macros').addEventListener('change',render);$('#muscles').addEventListener('change',render);
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>setType(b.dataset.t));
$('#sample').onclick=()=>{if(TYPE==='workout'&&wk.mode==='wizard')loadWizSample();else $('#src').value=SAMPLES[TYPE];render()};
$('#clear').onclick=()=>{if(TYPE==='workout'&&wk.mode==='wizard'){if(!confirm('לנקות את כל הימים?'))return;wk.days=[];wk.notes='';$('#wkNotes').value='';saveWk();drawDays()}else $('#src').value='';render()};
addEventListener('resize',later);

async function makePdf(){
  await render();
  const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
  for(let i=0;i<pages.length;i++){
    const c=await html2canvas(pages[i],{scale:2.5,backgroundColor:'#ffffff',useCORS:true,logging:false});
    if(i) pdf.addPage();
    pdf.addImage(c.toDataURL('image/jpeg',.95),'JPEG',0,0,210,297);
  }
  const o=opts();
  return {pdf,fname:`${o.title}${o.client?' - '+o.client:''}.pdf`};
}
async function busy(btn,fn){const t=btn.textContent;btn.disabled=true;btn.textContent='מייצר…';try{await fn()}catch(e){alert('שגיאה ביצירת PDF: '+e.message)}finally{btn.disabled=false;btn.textContent=t}}
$('#dl').onclick=()=>busy($('#dl'),async()=>{if(!pages.length)return alert('אין עדיין תוכן');const{pdf,fname}=await makePdf();pdf.save(fname)});
try{if(navigator.canShare&&navigator.canShare({files:[new File([''],'a.pdf',{type:'application/pdf'})]}))$('#share').hidden=false}catch(e){}
$('#share').onclick=()=>busy($('#share'),async()=>{if(!pages.length)return;const{pdf,fname}=await makePdf();const f=new File([pdf.output('blob')],fname,{type:'application/pdf'});await navigator.share({files:[f],title:fname})});

setType('workout',true);
</script>
